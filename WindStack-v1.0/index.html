<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WindStack | Filament Winder</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.160.0",
            "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div class="container">
        <!-- LEFT: CONTROLS PANEL -->
        <div class="input-panel card" id="controls-panel">
            <div class="toolbar">
                <h2><i class="fas fa-layer-group"></i> WindStack</h2>
                <div class="toolbar-buttons">
                    <button class="btn btn-sm btn-primary" id="klipper-cfg-btn" title="Klipper printer.cfg & Macros Generator"><i class="fas fa-terminal"></i></button>
                    <button class="btn btn-sm" id="adv-geo-btn" title="Non-Cylindrical Mandrels & Dome Transitions" style="background:#2c3e50;"><i class="fas fa-shapes"></i></button>
                    <button class="btn btn-sm btn-primary" id="jobsheet-btn" title="Manufacturing Traveler & Shop Job Sheet"><i class="fas fa-clipboard-list"></i></button>
                    <button class="btn btn-sm btn-primary" id="save-btn" title="Save Project to File"><i class="fas fa-save"></i></button>
                    <button class="btn btn-sm btn-primary" id="load-btn" title="Load Project File"><i class="fas fa-folder-open"></i></button>
                    <button class="btn btn-sm" id="new-project-btn" title="New Blank Project" style="background:rgba(255,255,255,0.1);"><i class="fas fa-redo"></i></button>
                </div>
            </div>

            <!-- Machine Selector -->
            <div class="section" id="machine-section">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                    <h3 class="section-title" style="margin-bottom:0;">Machine Profile</h3>
                    <button class="btn btn-sm btn-primary" id="manage-machines-btn" title="Manage & Configure Machines" style="padding:2px 8px; font-size:0.78em;"><i class="fas fa-sliders-h"></i> Configure</button>
                </div>
                <select id="machine-select"></select>
            </div>

            <!-- Mandrel Settings -->
            <div class="section" id="mandrel-section">
                <h3 class="section-title">Mandrel</h3>
                <div class="input-grid-2">
                    <div class="input-group">
                        <label>Diameter (mm)</label>
                        <input type="number" id="mandrelDiameter" value="22.63" step="0.01">
                    </div>
                    <div class="input-group">
                        <label>Length (mm)</label>
                        <input type="number" id="partLength" value="150" step="1">
                    </div>
                </div>
            </div>

            <!-- Material Selector -->
            <div class="section" id="material-section">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                    <h3 class="section-title" style="margin-bottom:0;">Material (Fiber)</h3>
                    <button class="btn btn-sm btn-success" id="manage-materials-btn" title="Manage Fiber Library" style="padding:2px 8px; font-size:0.78em;"><i class="fas fa-layer-group"></i> Library</button>
                </div>
                <select id="material-select"></select>
                <div id="material-info" class="info-badge">—</div>
            </div>

            <!-- Global Winding Settings -->
            <div class="section" id="globals-section">
                <h3 class="section-title">Winding Settings</h3>
                <div class="input-grid-2">
                    <div class="input-group">
                        <label>Feed Rate (mm/min)</label>
                        <input type="number" id="feedRate" value="8000">
                    </div>
                    <div class="input-group">
                        <label>Dwell Speed (deg/min)</label>
                        <input type="number" id="dwellSpeed" value="2000">
                    </div>
                </div>
            </div>

            <!-- Layer Stack -->
            <div class="section">
                <h3 class="section-title">Layer Stack</h3>
                <div id="layer-stack"></div>
                <div class="button-grid-2">
                    <button class="btn btn-success" id="add-helical-btn"><i class="fas fa-plus"></i> Helical</button>
                    <button class="btn btn-warning" id="add-hoop-btn"><i class="fas fa-plus"></i> Hoop</button>
                </div>
            </div>

            <div class="divider"></div>

            <div id="validation-banner" class="validation-banner" style="display:none;"></div>
            <button id="generate-btn" class="btn btn-primary btn-full"><i class="fas fa-play"></i> Generate G-Code</button>

            <!-- G-Code & Job Statistics Output -->
            <div class="section gcode-section">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                    <label class="section-title" style="margin-bottom:0;">Job Estimates & G-Code</label>
                </div>

                <!-- Production Statistics Card -->
                <div class="job-stats-card" id="job-stats-card">
                    <div class="stats-grid-4">
                        <div class="stat-item">
                            <span class="stat-label"><i class="fas fa-stopwatch"></i> Est. Time</span>
                            <span class="stat-value" id="stat-time">—</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label"><i class="fas fa-ruler"></i> Tow Length</span>
                            <span class="stat-value" id="stat-length">—</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label"><i class="fas fa-weight-hanging"></i> Part Weight</span>
                            <span class="stat-value" id="stat-weight">—</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label"><i class="fas fa-tag"></i> Fiber Cost</span>
                            <span class="stat-value" id="stat-cost">—</span>
                        </div>
                    </div>
                </div>

                <div id="gcode-output" class="gcode-display"></div>
                <div class="button-grid-3" style="display:grid; grid-template-columns: 1fr 1fr 1.2fr; gap:6px;">
                    <button id="copy-btn" class="btn btn-primary btn-sm"><i class="fas fa-copy"></i> Copy</button>
                    <button id="download-btn" class="btn btn-primary btn-sm"><i class="fas fa-download"></i> Download</button>
                    <button id="upload-winder-btn" class="btn btn-success btn-sm" title="Upload directly to Klipper over WiFi (Moonraker)"><i class="fas fa-cloud-upload-alt"></i> Upload</button>
                </div>
            </div>
        </div>

        <!-- RIGHT: VIEWER -->
        <div class="card viewer-card">
            <div class="tab-bar">
                <div class="tab active" data-view="3d"><i class="fas fa-cube"></i> 3D View</div>
                <div class="tab" data-view="2d"><i class="fas fa-map"></i> 2D Coverage</div>
            </div>
            <div id="viewer-container">
                <div id="loading-overlay">Generating...</div>
                <div id="view-3d" class="view-content active">
                    <div id="canvas-wrapper"></div>
                    <div class="overlay-controls">
                        <button id="play-btn"><i class="fas fa-play"></i></button>
                        <input type="range" id="sim-slider" min="0" max="100" value="100">
                        <span id="sim-progress">100%</span>
                    </div>
                </div>
                <div id="view-2d" class="view-content">
                    <div class="legend-2d">
                        <div style="font-weight:bold; color:#ecf0f1; border-bottom:1px solid #444; padding-bottom:3px; margin-bottom:4px;">Layer Breakdown</div>
                        <div style="color:#95a5a6; font-size:0.85em;">Click "Generate G-Code" to view layer trace breakdown</div>
                        <div id="coverage-mode-toggle" style="margin-top:8px; display:flex; gap:4px;">
                            <button class="btn btn-sm btn-primary" id="btn-mode-traces" style="font-size:0.75em; padding:2px 8px;">Traces</button>
                            <button class="btn btn-sm" id="btn-mode-heatmap" style="font-size:0.75em; padding:2px 8px; background:rgba(255,255,255,0.1);">Heatmap</button>
                        </div>
                    </div>
                    <div id="canvas-2d-wrapper">
                        <canvas id="canvas2d"></canvas>
                    </div>
                    <div class="overlay-controls">
                        <button id="play-btn-2"><i class="fas fa-play"></i></button>
                        <input type="range" id="sim-slider-2" min="0" max="100" value="100">
                        <span id="sim-progress-2">100%</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div id="status-bar">
        <span id="status-machine">Machine: —</span>
        <span id="status-material">Material: —</span>
        <span id="status-coverage">Layers: —</span>
        <span id="status-autosave" style="margin-left:auto;"><i class="fas fa-check-circle" style="color:#2ecc71;"></i> Auto-saved</span>
    </div>

    <!-- Hidden file input for project loading -->
    <input type="file" id="file-input" accept=".json" style="display:none">

    <script type="module" src="js/app.js"></script>
</body>
</html>
